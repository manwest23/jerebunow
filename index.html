<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2433">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JerebuNow">
  <meta name="description" content="Malaysian haze and Air Pollutant Index (API / IPU) near you, with running advice and forecast. Bahasa Melayu &amp; English.">
  <title>JerebuNow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-v2.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v2.png">
  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <!-- Swipeable location pages -->
  <main class="pager" id="pager" aria-label="Locations"></main>

  <!-- Add to Home Screen (hidden once installed) -->
  <button class="tb-btn install-btn" id="installBtn" type="button" aria-label="Add to Home Screen" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>
  </button>

  <!-- Haze alerts (shown when alerts are set up) -->
  <button class="tb-btn alerts-btn" id="alertsBtn" type="button" aria-label="Alerts" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15Z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>
    <i class="on-dot" hidden></i>
  </button>

  <!-- Floating bottom bar -->
  <nav class="toolbar" id="toolbar">
    <button class="tb-btn" id="mapBtn" type="button" aria-label="Air quality map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5 3.5 6.5v13L9 17.5l6 2 5.5-2v-13L15 6.5l-6-2Z"/><path d="M9 4.5v13M15 6.5v13"/></svg>
    </button>
    <div class="dots" id="dots" role="tablist" aria-label="Pages"></div>
    <button class="tb-btn" id="listBtn" type="button" aria-label="All locations">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1" class="fill"/><circle cx="4.5" cy="12" r="1" class="fill"/><circle cx="4.5" cy="17.5" r="1" class="fill"/></svg>
    </button>
  </nav>

  <!-- Locations list -->
  <section class="listview view" id="listView" aria-labelledby="listTitle">
    <div class="list-scroll" id="listScroll"><div class="list-inner">
      <div class="list-top">
        <h1 id="listTitle">Jerebu<b>Now</b></h1>
        <button class="more-btn" id="editBtn" type="button">Edit</button>
      </div>
      <ul class="loc-cards" id="locCards"></ul>
      <footer class="foot">
        <div id="listLang"></div>
        <p class="visitors" id="listVisitors" hidden></p>
        <p id="listSource">&nbsp;</p>
        <p class="credit" id="listCredit">Developed by <b>manwest</b></p>
      </footer>
    </div></div>
    <button class="searchbar" id="searchOpen" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.8"/><path d="m10.5 10.5 3.5 3.5"/></svg>
      <span id="searchLabel">Search for a station or state</span>
    </button>
  </section>

  <!-- Air quality map (map.js fills it on first open) -->
  <section class="mapview view" id="mapView" aria-label="Map">
    <p class="map-status" aria-live="polite"></p>
  </section>

  <!-- Station search sheet -->
  <div class="sheet-wrap view" id="sheet">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-top">
        <h2 id="sheetTitle">Add a location</h2>
        <button class="link-btn" id="sheetCancel" type="button" data-close>Cancel</button>
      </div>
      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.8"/><path d="m10.5 10.5 3.5 3.5"/></svg>
        <input id="search" type="search" placeholder="Search station or state" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="list-sheet"><ul class="list" id="allList"></ul><ul class="list" id="worldList"></ul></div>
    </div>
  </div>

  <!-- Haze alerts sheet -->
  <div class="sheet-wrap view" id="alertsSheet">
    <div class="sheet-backdrop" data-close-alerts></div>
    <div class="sheet sheet-short" role="dialog" aria-modal="true" aria-labelledby="alertsTitle">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-top">
        <h2 id="alertsTitle">Haze alerts</h2>
        <button class="link-btn" type="button" data-close-alerts id="alertsClose">Done</button>
      </div>
      <p class="alerts-sub" id="alertsSub"></p>
      <form class="alerts-form" id="alertsForm">
        <fieldset><legend id="alertsPlaceLabel"></legend><div class="opts" id="alertsPlaces"></div></fieldset>
        <fieldset><legend id="alertsRulesLabel"></legend><div class="opts" id="alertsRules"></div></fieldset>
        <p class="alerts-msg" id="alertsMsg" role="status" aria-live="polite"></p>
        <button class="pill alerts-go" id="alertsGo" type="submit">Turn on alerts</button>
        <button class="link-btn alerts-off" id="alertsOff" type="button" hidden>Turn off alerts</button>
        <p class="small alerts-quiet" id="alertsQuiet"></p>
      </form>
    </div>
  </div>

  <!-- Add to Home Screen instructions -->
  <div class="sheet-wrap view" id="installSheet">
    <div class="sheet-backdrop" data-close-install></div>
    <div class="sheet sheet-short" role="dialog" aria-modal="true" aria-labelledby="installTitle">
      <div class="grabber" aria-hidden="true"></div>
      <div class="install-head">
        <img src="icons/icon-192-v2.png" alt="" width="64" height="64">
        <div><h2 id="installTitle">Add JerebuNow to your Home Screen</h2><p id="installSub"></p></div>
      </div>
      <div class="seg install-tabs" id="installTabs" role="group">
        <button type="button" data-os="ios" aria-pressed="true">iPhone</button>
        <button type="button" data-os="android" aria-pressed="false">Android</button>
      </div>
      <button class="pill install-now" id="installNow" type="button" hidden>Install JerebuNow</button>
      <p class="install-or" id="installOr" hidden></p>
      <ol class="install-steps" id="installSteps"></ol>
      <button class="pill install-done" id="installDone" type="button" data-close-install>OK</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="iqair.js"></script>
  <script src="fx.js"></script>
  <script src="app.js"></script>
</body>
</html>
