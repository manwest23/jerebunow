name: Update IQAir cities and fire hotspots

on:
  schedule:
    - cron: "25 */3 * * *"   # every 3 hours
  push:
    paths:
      - "scripts/fetch-world.mjs"
      - "scripts/fetch-fires.mjs"
      - ".github/workflows/update-world.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch IQAir cities
        env:
          IQAIR_KEY: ${{ secrets.IQAIR_KEY }}
        run: node scripts/fetch-world.mjs
      - name: Fetch fire hotspots (NASA FIRMS)
        run: node scripts/fetch-fires.mjs || echo "FIRMS unavailable this run"
      - name: Commit data
        run: |
          git config user.name "haze-bot"
          git config user.email "haze-bot@users.noreply.github.com"
          git add data/world.json data/fires.json
          git diff --cached --quiet && exit 0
          git commit -m "Update IQAir cities and fire hotspots"
          git pull --rebase origin main
          git push
